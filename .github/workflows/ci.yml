name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Runs on Linux so the tests are fast and free. The app is cross-platform in
    # its core; the GUI is exercised separately on Windows below.
    name: Tests (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          sudo apt-get install -y --no-install-recommends xvfb

      # Xvfb gives the interface tests a virtual screen; core tests need none.
      - name: Tests
        run: xvfb-run -a pytest -v

      - name: Lint
        run: |
          pip install ruff
          ruff check .

  headless-check:
    name: Entry point behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: CLI answers --version without a display
        run: python main.py --version

      - name: CLI refuses to open a window headless, with a readable message
        run: |
          set +e
          out=$(env -u DISPLAY python main.py 2>&1)
          rc=$?
          echo "$out"
          test $rc -ne 0
          # must be a readable message, not a traceback
          echo "$out" | grep -q "Графический интерфейс"
          ! echo "$out" | grep -q "Traceback"

  no-third-party:
    name: Runtime uses only the standard library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A dependency creeping into runtime would bloat the .exe and could break
      # the build on a machine that only has Python. Fail the build instead.
      - name: No third-party imports
        run: |
          if grep -rn --include='*.py' -E '^\s*(import|from)\s+(flask|cryptography|requests|numpy|pandas|PyQt)' .; then
            echo "Third-party import found in runtime code."
            exit 1
          fi
          echo "clean"

      - name: requirements.txt declares no runtime packages
        run: |
          pip install -r requirements.txt
          if [ -n "$(pip list --format=freeze --not-required 2>/dev/null)" ]; then
            echo "runtime deps present:"
            pip list --format=freeze --not-required
          fi